name: Diagnose atlas figure candidates

on:
  workflow_dispatch:
  push:
    paths:
      - 'diagnose_figures.py'
      - 'diagnose_pdf_captions.py'
      - '.github/workflows/diagnose-atlas.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-atlas.txt
      - name: Install dependencies
        run: pip install -r requirements-atlas.txt
      - name: Print HTML candidate figure captions
        run: python diagnose_figures.py
      - name: Print PDF candidate figure captions
        run: python diagnose_pdf_captions.py
